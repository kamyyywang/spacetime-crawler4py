[IDENTIFICATION]
# Sent to the course cache to attribute requests to the group and quarter.
useragent = IR UF26 11215456

[CONNECTION]
# Registration endpoint; the service assigns the actual download-cache port.
host = styx.ics.uci.edu
port = 9000

[CRAWLER]
# Seed every required domain family; subdomains are then discovered through links.
seedurl = https://www.ics.uci.edu,https://www.cs.uci.edu,https://www.informatics.uci.edu,https://www.stat.uci.edu
politeness = 0.5
# Optional sitemap discovery exists in the code but was disabled for this run.
sitemaps = false
# Local delays after failures 1-3; failure 4 exhausts the persistent budget.
# A longer required delay (for example DNS or Retry-After) takes precedence.
retry_delays = 300,1800,7200

[LOCAL PROPERTIES]
save = frontier.shelve
# The final crawl used ONE worker. Thread-safe support and concurrency tests
# exist, but this setting does not demonstrate a multithreaded deployment.
threadcount = 1

